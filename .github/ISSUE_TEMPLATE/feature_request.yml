name: 功能建议
description: 提出一个新功能或改进
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的场景与痛点，而不是直接给方案
      placeholder: 导入一个 5 万行的 hosts 列表时 App 会卡住十几秒。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何实现？若有参考实现（其他开源项目）欢迎附上链接
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅 UI
        - 规则管理 / 订阅
        - VPN 核心链路
        - 设置 / 上游
        - 统计 / 日志
        - 构建 / 工程
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与
      options:
        - label: 我愿意提交 PR 实现该功能
