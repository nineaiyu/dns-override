name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签，例如 v2.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # secrets 上下文不能用于 step 的 if，因此先算成 output
      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已检测到签名配置"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 SIGNING_KEYSTORE_BASE64，将回退使用 debug 签名（仅供验证）"
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          # 写入项目级配置（不在日志中回显口令）
          {
            echo "DNSOVERRIDE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "DNSOVERRIDE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "DNSOVERRIDE_KEY_ALIAS=$KEY_ALIAS"
            echo "DNSOVERRIDE_KEY_PASSWORD=$KEY_PASSWORD"
          } > keystore.properties
          # 确认签名配置被读取（不打印口令本身）
          test -s keystore.properties

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        id: artifact
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          NAME="dns-override-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/${{ steps.artifact.outputs.name }}
